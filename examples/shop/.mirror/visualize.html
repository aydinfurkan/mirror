he name, the price and the description.","Fail: show \"Product not found.\" for 404."],"status":null},{"n":2,"title":"Tap \"Add to cart\".","text":"Tap \"Add to cart\". Then: add one item to the cart in `AsyncStorage`. Show \"Added to cart.\".","details":["Then: add one item to the cart in `AsyncStorage`. Show \"Added to cart.\"."],"status":null}]}]},{"id":"api","kind":"backend","definition":"The `api` project is the HTTP API of the shop. It serves the products, creates the orders, and takes the payment events from Stripe.\n\n## Stack\n\n- TypeScript on Node 20. Fastify 4. zod. `pg` for Postgres, `ioredis` for Redis, `kafkajs` for Kafka, the Stripe SDK.\n- This example has no code.\n\n## Technical decisions\n\n- Keep the products and the orders in Postgres (`shop-db`).\n- Cache the product list in Redis (`product-cache`) for 60 seconds.\n- Create a Stripe Checkout session for each order. Mark the order paid only from the Stripe webhook, not from the browser.\n- Publish `order.paid` to the Kafka topic `order.events` after an order is paid.\n- Map errors to HTTP: `validation` 400, `not-found` 404, `conflict` 409, an unexpected error 500.\n","status":null,"flows":[{"id":"cancel-order","kind":"flow","trigger":"http","entry":"POST /orders/:id/cancel","group":"orders","definition":"Cancel a paid order, refund the payment with Stripe, and tell the other services.\n","rules":"**Relates to:** `web/order-status`, `worker/update-stock`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nA customer can change their mind after the payment. The shop lets them cancel for 24 hours.\n\n## Goal\n\n- Cancel a paid order and give the money back.\n- Put the items of the order back in the stock.\n\n## Non-goal\n\n- Cancel a part of an order.\n- Cancel an order that is shipped.\n\n## Constraints\n\n- A customer can cancel only a paid order, and only in the 24 hours after the order.\n- Give the money back before the order is cancelled.\n- Put the items back in the stock only after the order is cancelled.\n\n## Acceptance criteria\n\n- A paid order of the last 24 hours is cancelled.\n- An order that is not paid, is already cancelled, or is older than 24 hours cannot be cancelled.\n- When the refund fails, the order stays paid and the customer sees an error.\n- The items of a cancelled order go back in the stock one time.\n\n## Open questions\n\n- Should the customer get an email for the refund?\n","input":"- None.","output":"Example (200):\n\n```json\n{ \"id\": \"o1\", \"status\": \"cancelled\" }\n```\n\nExample (409):\n\n```json\n{ \"error\": { \"code\": \"conflict\", \"message\": \"Only a paid order of the last 24 hours can be cancelled.\" } }\n```","contract":"## Input\n\n`POST /orders/:id/cancel`:\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `id` | path string | yes | not empty |\n\n## Output\n\n| Status | Body | When |\n| --- | --- | --- |\n| 200 | `{ id, status: \"cancelled\" }` | The order is cancelled and the refund exists. |\n| 404 | `{ error: { code: \"not-found\", message } }` | The order does not exist. |\n| 409 | `{ error: { code: \"conflict\", message } }` | The order is not `paid`, or it is older than 24 hours. |\n| 502 | `{ error: { code: \"payment\", message } }` | Stripe does not answer. |\n\n## Dependencies\n\n- reads `shop-db`: the order, its status and its payment id.\n- calls `stripe`: creates a refund for the payment.\n- writes `shop-db`: the order with the status `cancelled`.\n- publishes `order-events`: the event `order.cancelled` with the items.\n","status":null,"steps":[{"n":1,"title":"Read the order.","text":"Read the order. Fail: return HTTP 404 when it does not exist. Fail: return HTTP 409 when it is not `paid` or is older than 24 hours.","details":["Fail: return HTTP 404 when it does not exist.","Fail: return HTTP 409 when it is not `paid` or is older than 24 hours."],"status":null},{"n":2,"title":"Refund the payment with Stripe.","text":"Refund the payment with Stripe. Fail: return HTTP 502 when Stripe does not answer.","details":["Fail: return HTTP 502 when Stripe does not answer."],"status":null},{"n":3,"title":"Save the order with the status `cancelled`.","text":"Save the order with the status `cancelled`.","details":[],"status":null},{"n":4,"title":"Publish `order.cancelled` with the items of the order.","text":"Publish `order.cancelled` with the items of the order.","details":[],"status":null},{"n":5,"title":"Return the order id and the new status.","text":"Return the order id and the new status.","details":[],"status":null}]},{"id":"create-order","kind":"flow","trigger":"http","entry":"POST /orders","group":"orders","definition":"Create an order from a cart and start the payment with Stripe.\n","rules":"**Relates to:** `web/checkout`, `api/stripe-webhook`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nA customer clicks \"Pay\" on the checkout page. The shop saves the order and sends the customer to Stripe to pay.\n\n## Goal\n\n- Save an order with the prices of now, not the prices the customer saw before.\n- Send the customer to pay.\n\n## Non-goal\n\n- Take the payment. Stripe does it.\n- Hold the stock. The stock changes after the payment.\n\n## Constraints\n\n- Use the current price of each item.\n- The order is not paid until Stripe confirms the payment.\n\n## Acceptance criteria\n\n- A valid cart creates an order and sends the customer to pay.\n- The order total uses the current prices.\n- A cart with more items than the stock is refused.\n- When Stripe fails, the order stays unpaid and the customer sees an error.\n\n## Open questions\n\n- Should an unpaid order expire after 24 hours?\n","input":"Example:\n\n```json\n{ \"email\": \"ada@example.com\", \"items\": [{ \"productId\": \"p1\", \"quantity\": 2 }] }\n```","output":"Example (201):\n\n```json\n{ \"orderId\": \"o1\", \"sessionId\": \"cs_test_a1b2\" }\n```\n\nExample (409):\n\n```json\n{ \"error\": { \"code\": \"conflict\", \"field\": \"items\", \"message\": \"Blue mug has only 1 left.\" } }\n```","contract":"## Input\n\n`POST /orders`, JSON body:\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `email` | string | yes | valid email |\n| `items` | array | yes | 1–50 items |\n| `items[].productId` | string | yes | not empty |\n| `items[].quantity` | integer | yes | 1–10 |\n\n## Output\n\n| Status | Body | When |\n| --- | --- | --- |\n| 201 | `{ orderId, sessionId }` | The order is saved and the Stripe session exists. |\n| 400 | `{ error: { code: \"validation\", field, message } }` | A field fails its validation. |\n| 409 | `{ error: { code: \"conflict\", field: \"items\", message } }` | A product is not for sale or has too little stock. |\n| 502 | `{ error: { code: \"payment\", message } }` | Stripe does not answer. |\n\n## Dependencies\n\n- reads `shop-db`: the products and their prices.\n- writes `shop-db`: the order with the status `pending`.\n- calls `stripe`: creates a Checkout session.\n","status":null,"steps":[{"n":1,"title":"Validate the body.","text":"Validate the body. Fail: return HTTP 400 when it is not valid.","details":["Fail: return HTTP 400 when it is not valid."],"status":null},{"n":2,"title":"Read the products of the cart and their prices.","text":"Read the products of the cart and their prices. Fail: return HTTP 409 when a product does not exist, is not active, or has less stock than the quantity.","details":["Fail: return HTTP 409 when a product does not exist, is not active, or has less stock than the quantity."],"status":null},{"n":3,"title":"Save the order with the status `pending`.","text":"Save the order with the status `pending`.","details":[],"status":null},{"n":4,"title":"Create a Stripe Checkout session for the order.","text":"Create a Stripe Checkout session for the order. Put the order id in the session metadata.","details":["Put the order id in the session metadata."],"status":null},{"n":5,"title":"Return the order id and the session id.","text":"Return the order id and the session id.","details":[],"status":null}]},{"id":"get-order","kind":"flow","trigger":"http","entry":"GET /orders/:id","group":"orders","definition":"Return one order with its status and its items.\n","rules":"**Relates to:** `web/order-status`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nA customer comes back from the payment and wants to know if the order is paid.\n\n## Goal\n\n- Show the status, the total and the items of the order.\n\n## Non-goal\n\n- Check who asks. The order number is long and hard to guess.\n\n## Constraints\n\n- Show only the domain of the customer email, not the full email.\n\n## Acceptance criteria\n\n- A customer sees an order that exists.\n- A customer sees \"not found\" for an order that does not exist.\n\n## Open questions\n\n- Should the customer need a link from the email to see the order?\n","input":"- None.","output":"Example (200):\n\n```json\n{ \"id\": \"o1\", \"status\": \"paid\", \"totalCents\": 2400, \"items\": [{ \"productId\": \"p1\", \"name\": \"Blue mug\", \"quantity\": 2 }] }\n```\n\nExample (404):\n\n```json\n{ \"error\": { \"code\": \"not-found\", \"message\": \"Order not found.\" } }\n```","contract":"## Input\n\n`GET /orders/:id`:\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `id` | path string | yes | not empty |\n\n## Output\n\n| Status | Body | When |\n| --- | --- | --- |\n| 200 | `Order` | The order exists. |\n| 404 | `{ error: { code: \"not-found\", message } }` | The order does not exist. |\n\n## Dependencies\n\n- reads `shop-db`: the order and its items.\n","status":null,"steps":[{"n":1,"title":"Read the order and its items from the database.","text":"Read the order and its items from the database. Fail: return HTTP 404 when it does not exist.","details":["Fail: return HTTP 404 when it does not exist."],"status":null},{"n":2,"title":"Return the order.","text":"Return the order.","details":[],"status":null}]},{"id":"get-product","kind":"flow","trigger":"http","entry":"GET /products/:id","group":"products","definition":"Return one product with its details.\n","rules":"**Relates to:** `web/product-detail`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nA customer opens one product to read about it before they add it to the cart.\n\n## Goal\n\n- Show the product with its description, price and stock.\n\n## Non-goal\n\n- Show the reviews of the product.\n\n## Constraints\n\n- Do not show a product that is not for sale.\n\n## Acceptance criteria\n\n- A customer sees a product that is for sale.\n- A customer sees \"not found\" for a product that does not exist.\n- A customer sees \"not found\" for a product that is not for sale.\n\n## Open questions\n\n- None.\n","input":"- None.","output":"Example (200):\n\n```json\n{ \"id\": \"p1\", \"name\": \"Blue mug\", \"description\": \"A mug for tea.\", \"priceCents\": 1200, \"stock\": 8 }\n```\n\nExample (404):\n\n```json\n{ \"error\": { \"code\": \"not-found\", \"message\": \"Product not found.\" } }\n```","contract":"## Input\n\n`GET /products/:id`:\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `id` | path string | yes | not empty |\n\n## Output\n\n| Status | Body | When |\n| --- | --- | --- |\n| 200 | `Product` with `description` | The product exists and is active. |\n| 404 | `{ error: { code: \"not-found\", message } }` | The product does not exist or is not active. |\n\n## Dependencies\n\n- reads `shop-db`: the product by id.\n","status":null,"steps":[{"n":1,"title":"Read the product from the database.","text":"Read the product from the database. Fail: return HTTP 404 when it does not exist or is not active.","details":["Fail: return HTTP 404 when it does not exist or is not active."],"status":null},{"n":2,"title":"Return the product.","text":"Return the product.","details":[],"status":null}]},{"id":"list-products","kind":"flow","trigger":"http","entry":"GET /products","group":"products","definition":"List the products that are for sale.\n","rules":"**Relates to:** `web/products`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nA customer opens the shop. The page shows all the products that are for sale.\n\n## Goal\n\n- Show each product for sale with its price and its stock.\n\n## Non-goal\n\n- Filter the list or split it in pages. The shop has few products.\n\n## Constraints\n\n- Do not show a product that is not for sale.\n- A price change can take up to 60 seconds to show.\n\n## Acceptance criteria\n\n- Show the products for sale, sorted by name.\n- Show an empty list when no product is for sale.\n\n## Open questions\n\n- None.\n","input":"- None.","output":"Example (200):\n\n```json\n[{ \"id\": \"p1\", \"name\": \"Blue mug\", \"priceCents\": 1200, \"stock\": 8 }]\n```\n\nExample (500):\n\n```json\n{ \"error\": { \"code\": \"unexpected\", \"message\": \"Try again later.\" } }\n```","contract":"## Input\n\n`GET /products`. No parameters.\n\n## Output\n\n| Status | Body | When |\n| --- | --- | --- |\n| 200 | `Product[]` | Always. The list can be empty. |\n| 500 | `{ error: { code: \"unexpected\", message } }` | The database fails. |\n\n## Dependencies\n\n- reads `product-cache`: the cached list, 60 seconds.\n- reads `shop-db`: the active products, when the cache is empty.\n","status":null,"steps":[{"n":1,"title":"Read the product list from the cache.","text":"Read the product list from the cache. Return the cached list when it exists.","details":["Return the cached list when it exists."],"status":null},{"n":2,"title":"Read the products from the database.","text":"Read the products from the database. Read only the products with `active` set to true, sorted by name.","details":["Read only the products with `active` set to true, sorted by name."],"status":null},{"n":3,"title":"Put the list in the cache for 60 seconds.","text":"Put the list in the cache for 60 seconds.","details":[],"status":null},{"n":4,"title":"Return the list.","text":"Return the list.","details":[],"status":null}]},{"id":"stripe-webhook","kind":"flow","trigger":"http","entry":"POST /webhooks/stripe","group":"payments","definition":"Mark an order paid when Stripe says that the payment is complete.\n","rules":"**Relates to:** `api/create-order`, `worker/send-receipt`, `worker/update-stock`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nStripe tells the shop when a customer pays. It is the only way an order becomes paid.\n\n## Goal\n\n- Mark the order paid one time.\n- Start the receipt and the stock change.\n\n## Non-goal\n\n- Handle refunds. A person does them in Stripe.\n\n## Constraints\n\n- Trust only a message that really comes from Stripe.\n- Stripe can send the same payment more than one time.\n\n## Acceptance criteria\n\n- An unpaid order becomes paid when Stripe confirms the payment.\n- The receipt and the stock change happen one time per order, also when Stripe sends the payment two times.\n- A message that does not come from Stripe changes nothing.\n- Other news from Stripe changes nothing.\n\n## Open questions\n\n- None.\n","input":"Example:\n\n```json\n{ \"id\": \"evt_1\", \"type\": \"checkout.session.completed\", \"data\": { \"object\": { \"id\": \"cs_test_a1b2\", \"metadata\": { \"orderId\": \"o1\" } } } }\n```","output":"Example (published):\n\n```json\n{ \"eventId\": \"evt_1\", \"type\": \"order.paid\", \"orderId\": \"o1\", \"email\": \"ada@example.com\", \"items\": [{ \"productId\": \"p1\", \"quantity\": 2 }] }\n```\n\nExample (400):\n\n```json\n{ \"error\": { \"code\": \"signature\", \"message\": \"Invalid signature.\" } }\n```","contract":"## Input\n\n`POST /webhooks/stripe`, header `Stripe-Signature`, JSON body: a Stripe event.\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `type` | string | yes | Stripe event type |\n| `data.object.metadata.orderId` | string | yes | for `checkout.session.completed` |\n\n## Output\n\n| Status | Body | When |\n| --- | --- | --- |\n| 200 | `{ received: true }` | The event is handled or skipped. |\n| 400 | `{ error: { code: \"signature\", message } }` | The signature is not valid. |\n| Publish `order.paid` | `{ eventId, orderId, email, items }` | The order changes to `paid`. |\n\n## Dependencies\n\n- writes `shop-db`: the order status `paid`.\n- publishes `order-events`: the event `order.paid`.\n","status":null,"steps":[{"n":1,"title":"Check the Stripe signature of the request.","text":"Check the Stripe signature of the request. Fail: return HTTP 400 when the signature is not valid.","details":["Fail: return HTTP 400 when the signature is not valid."],"status":null},{"n":2,"title":"Skip each event that is not `checkout.session.completed`.","text":"Skip each event that is not `checkout.session.completed`. Return HTTP 200 for it.","details":["Return HTTP 200 for it."],"status":null},{"n":3,"title":"Set the status of the order to `paid`.","text":"Set the status of the order to `paid`. Do nothing when the order is already `paid`.","details":["Do nothing when the order is already `paid`."],"status":null},{"n":4,"title":"Publish `order.paid` to `order.events`.","text":"Publish `order.paid` to `order.events`.","details":[],"status":null}]}]},{"id":"worker","kind":"consumer","definition":"The `worker` project handles the order events from Kafka. It sends the receipt and updates the stock after a payment.\n\n## Stack\n\n- TypeScript on Node 20. `kafkajs`, `pg`, the SendGrid SDK.\n- This example has no code.\n\n## Technical decisions\n\n- Read the topic `order.events` in the consumer group `shop-worker`. Commit the offset after the handler ends.\n- Make each handler idempotent with the event id. Kafka can deliver an event more than one time.\n- Send an event that fails 5 times to the topic `order.events.dlq`.\n","status":null,"flows":[{"id":"send-receipt","kind":"flow","trigger":"message","entry":"order.events","group":"orders","definition":"Send the receipt email after an order is paid.\n","rules":"**Relates to:** `api/stripe-webhook`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nA customer pays. They expect an email with the order in a few minutes.\n\n## Goal\n\n- Send one receipt for each paid order.\n\n## Non-goal\n\n- Send marketing email.\n\n## Constraints\n\n- Send the receipt at most one time for each order.\n\n## Acceptance criteria\n\n- Send the receipt when an order is paid.\n- Send nothing when the shop hears about the same payment again.\n- After 5 failed tries, put the receipt aside for a person to check.\n\n## Open questions\n\n- None.\n","input":"Example:\n\n```json\n{ \"eventId\": \"evt_1\", \"type\": \"order.paid\", \"orderId\": \"o1\", \"email\": \"ada@example.com\" }\n```","output":"- None.","contract":"## Input\n\nTopic `order.events`, event `order.paid`:\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `eventId` | string | yes | not empty |\n| `orderId` | string | yes | not empty |\n| `email` | string | yes | valid email |\n\n## Output\n\n| Result | When |\n| --- | --- |\n| Send the receipt email | The receipt of the event is not sent yet. |\n| Do nothing | The event is not `order.paid`, or the receipt is already sent. |\n| Retry, then send the event to `order.events.dlq` | SendGrid fails 5 times. |\n\n## Dependencies\n\n- consumes `order-events`: the event `order.paid`.\n- reads `shop-db`: the sent receipts.\n- writes `shop-db`: a sent receipt.\n- calls `mailer`: sends the email.\n","status":null,"steps":[{"n":1,"title":"Skip each event that is not `order.paid`.","text":"Skip each event that is not `order.paid`.","details":[],"status":null},{"n":2,"title":"Skip the event when its receipt is already sent.","text":"Skip the event when its receipt is already sent.","details":[],"status":null},{"n":3,"title":"Send the receipt email with SendGrid.","text":"Send the receipt email with SendGrid.","details":[],"status":null},{"n":4,"title":"Record that the receipt is sent.","text":"Record that the receipt is sent.","details":[],"status":null}]},{"id":"update-stock","kind":"flow","trigger":"message","entry":"order.events","group":"orders","definition":"Take the paid items out of the stock, and put the cancelled items back.\n","rules":"**Relates to:** `api/stripe-webhook`, `api/cancel-order`\n**Inherits:** none\n**Supersedes:** none\n\n## Context\n\nThe stock must show what is left after each paid order, so the shop does not sell what it does not have.\n\n## Goal\n\n- Lower the stock by the paid quantity of each item.\n- Raise the stock by the quantity of each item of a cancelled order.\n\n## Non-goal\n\n- Reorder products from a supplier.\n\n## Constraints\n\n- Change the stock only one time for each payment and each cancel.\n- The stock can go below 0 when two customers pay for the last item. A person then fixes it.\n\n## Acceptance criteria\n\n- Lower the stock when an order is paid.\n- Raise the stock when an order is cancelled.\n- Change nothing when the shop hears about the same payment or cancel again.\n- Change all items of the order or none.\n\n## Open questions\n\n- Should the shop alert a person when the stock goes below 0?\n","input":"Example:\n\n```json\n{ \"eventId\": \"evt_1\", \"type\": \"order.paid\", \"orderId\": \"o1\", \"items\": [{ \"productId\": \"p1\", \"quantity\": 2 }] }\n```","output":"- None.","contract":"## Input\n\nTopic `order.events`, events `order.paid` and `order.cancelled`:\n\n| Field | Type | Required | Validation |\n| --- | --- | --- | --- |\n| `eventId` | string | yes | not empty |\n| `items[].productId` | string | yes | not empty |\n| `items[].quantity` | integer | yes | 1 or more |\n\n## Output\n\n| Result | When |\n| --- | --- |\n| Lower the stock of each item | The event is a new `order.paid`. |\n| Raise the stock of each item | The event is a new `order.cancelled`. |\n| Do nothing | The event is of another type, or its id is already recorded. |\n\n## Dependencies\n\n- consumes `order-events`: the events `order.paid` and `order.cancelled`.\n- writes `shop-db`: the stock and `stock_events`.\n","status":null,"steps":[{"n":1,"title":"Skip each event that is not `order.paid` or `order.cancelled`.","text":"Skip each event that is not `order.paid` or `order.cancelled`.","details":[],"status":null},{"n":2,"title":"Take the quantity of each item out of the stock, in one transaction.","text":"Take the quantity of each item out of the stock, in one transaction. Do it only for `order.paid`. Skip the event when its id is already in `stock_events`. Record the event id in `stock_events`.","details":["Do it only for `order.paid`.","Skip the event when its id is already in `stock_events`.","Record the event id in `stock_events`."],"status":null},{"n":3,"title":"Put the quantity of each item back in the stock, in one transaction.","text":"Put the quantity of each item back in the stock, in one transaction. Do it only for `order.cancelled`. Skip the event when its id is already in `stock_events`. Record the event id in `stock_events`.","details":["Do it only for `order.cancelled`.","Skip the event when its id is already in `stock_events`.","Record the event id in `stock_events`."],"status":null}]}]}]}</script>
<script id="mirror-app">
(function () {
  'use strict';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      // A link: an https link opens in a new tab. Other links show only their text.
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
        return /^https:\/\//.test(url) ? '<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>' : text;
      });
  }

  // A code block. A `json` block that parses is indented with two spaces and colored: keys,
  // strings, numbers, and true, false and null. Other blocks show as they are.
  function codeHtml(src, lang) {
    var cls = lang ? ' data-lang="' + esc(lang) + '"' : '';
    if (lang !== 'json') return '<pre' + cls + '><code>' + esc(src) + '</code></pre>';
    var pretty;
    try { pretty = JSON.stringify(JSON.parse(src), null, 2); } catch (e) { return '<pre' + cls + '><code>' + esc(src) + '</code></pre>'; }
    var re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, html = '', at = 0, m;
    while ((m = re.exec(pretty))) {
      html += esc(pretty.slice(at, m.index));
      var k = m[1] ? (m[2] ? 'jk' : 'js') : m[3] ? 'jl' : 'jn';
      html += '<span class="' + k + '">' + esc(m[1] || m[0]) + '</span>' + (m[2] ? esc(m[2]) : '');
      at = re.lastIndex;
    }
    return '<pre' + cls + '><code>' + html + esc(pretty.slice(at)) + '</code></pre>';
  }

  // The sections that show as a callout box, and the lists with their own markers.
  var CALLOUT = { 'context': 'goal', 'goal': 'goal', 'non-goal': 'non', 'open questions': 'q' };
  var LISTS = { 'acceptance criteria': 'checks', 'constraints': 'nums' };

  // A bullet as HTML. A short name before `: ` shows in bold, like `Header: the shop name`.
  function bulletHtml(s) {
    var m = /^([^:`*[\]]{1,28}):\s+(.*)$/.exec(s);
    return m ? '<strong class="bk">' + inline(m[1]) + ':</strong> ' + inline(m[2]) : inline(s);
  }

  // A header line like `**Relates to:** `api/get-order``, as a chip. Each flow or page in it
  // is a button that opens it.
  function chipLine(name, value) {
    var v = inline(value).replace(/<code>([a-z0-9_-]+\/[a-z0-9_.-]+)<\/code>/gi, '<button type="button" class="call" data-goto="$1" title="Open $1">$1</button>');
    return '<span class="mchip"><b>' + inline(name) + '</b> ' + v + '</span>';
  }

  // Headings, bullet and numbered lists, tables, code fences, paragraphs. Input is escaped first.
  // Context, Goal, Non-goal and Open questions show in a callout box. Acceptance criteria show
  // as checkboxes, and Constraints as numbers. Header lines like `**Relates to:** …` are chips.
  // folds: when given, each `#` or `##` section becomes a closed <details>; folds[i] true opens section i.
  function renderMd(text, folds) {
    var out = [], list = null, code = null, lang = '', sec = -1, box = false, lcls = '';
    function closeList() {
      if (list) { out.push(list === 'table' ? '</tbody></table>' : list === 'chips' ? '</div>' : '</' + list + '>'); list = null; }
    }
    function openList(tag) {
      if (list === tag) return;
      closeList();
      list = tag;
      out.push(tag === 'chips' ? '<div class="mchips">' : '<' + tag + (tag === 'ul' && lcls ? ' class="' + lcls + '"' : '') + '>');
    }
    function closeBox() { if (box) { closeList(); out.push('</div>'); box = false; } }
    function cells(line, tag) {
      return '<tr>' + line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) {
        return '<' + tag + '>' + inline(c.trim()) + '</' + tag + '>';
      }).join('') + '</tr>';
    }
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var m;
      if (code !== null) {
        if (/^```/.test(line)) { out.push(codeHtml(code.join('\n'), lang)); code = null; }
        else code.push(line);
        return;
      }
      if (/^\s*\|/.test(line)) {
        if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) return; // separator row
        if (list === 'table') { out.push(cells(line, 'td')); return; }
        closeList();
        list = 'table';
        out.push('<table><thead>' + cells(line, 'th') + '</thead><tbody>');
        return;
      }
      if (/^```/.test(line)) { closeList(); code = []; lang = line.replace(/^```/, '').trim().toLowerCase(); return; }
      if ((m = /^\*\*([^*]+?):\*\*\s*(.*)$/.exec(line))) { openList('chips'); out.push(chipLine(m[1], m[2])); return; }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
        closeList();
        closeBox();
        if (folds && m[1].length <= 2) {
          if (sec >= 0) out.push('</div></details>');
          sec++;
          out.push('<details class="fold" data-fold="' + sec + '"' + (folds[sec] ? ' open' : '') + '><summary>' + inline(m[2]) + '</summary><div>');
          return;
        }
        var lv = Math.min(m[1].length + 3, 6), t = m[2].trim().toLowerCase(), kind = CALLOUT[t];
        lcls = LISTS[t] || '';
        out.push('<h' + lv + (kind ? ' class="h-' + kind + '"' : '') + '>' + inline(m[2]) + '</h' + lv + '>');
        if (kind) { out.push('<div class="callout c-' + kind + '">'); box = true; }
        return;
      }
      if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { openList('ul'); out.push('<li>' + bulletHtml(m[1]) + '</li>'); return; }
      if ((m = /^\s*\d+\.\s+(.*)$/.exec(line))) { openList('ol'); out.push('<li>' + inline(m[1]) + '</li>'); return; }
      closeList();
      // The label line of an example block, like `Example (201):`.
      if (/^Example\b.*:$/.test(line.trim())) { out.push('<p class="exl">' + inline(line.trim().replace(/:$/, '')) + '</p>'); return; }
      if (line.trim()) out.push('<p>' + inline(line) + '</p>');
    });
    closeList();
    if (code !== null) out.push(codeHtml(code.join('\n'), lang));
    closeBox();
    if (sec >= 0) out.push('</div></details>');
    return out.join('');
  }

  // The first plain paragraph of a markdown text: the short definition shown on a row.
  function summary(md) {
    var out = [];
    String(md || '').split(/\r?\n/).some(function (line) {
      var s = line.trim();
      if (!s || /^(#|[-*]\s|\d+\.\s|\||```)/.test(s)) return out.length > 0;
      out.push(s);
      return false;
    });
    return out.join(' ');
  }

  var BADGE = { http: 'HTTP', main: 'MAIN', message: 'MSG', schedule: 'CRON', page: 'PAGE' };
  var STATUS = { added: 1, changed: 1, removed: 1 };

  // One project as rows: the project, its flows, and the steps of each flow.
  function model(p) {
    var pn = { key: p.id, type: 'project', title: p.id, label: p.id, sub: p.kind || '', badge: 'PROJECT', status: p.status || null, item: p };
    var all = [pn];
    var flows = (p.flows || []).map(function (f) {
      var key = p.id + '/' + f.id;
      var fn = { key: key, type: f.kind === 'page' ? 'page' : 'flow', title: f.id, label: f.id, sub: f.entry || '',
        badge: BADGE[f.trigger] || '', status: f.status || null, item: f };
      fn.unit = typeof f.actions === 'string' ? 'action' : 'step';
      all.push(fn);
      fn.steps = (f.steps || []).map(function (s, i) {
        var sn = { key: key + '#' + i, type: 'step', title: s.n + '. ' + s.text, label: s.title || s.text, num: s.n, sub: '',
          status: s.status || null, item: s, parent: f, parentKey: key };
        all.push(sn);
        return sn;
      });
      return fn;
    });
    return { project: pn, flows: flows, groups: groups(flows), all: all };
  }

  // Flows by the group of their frontmatter, in order of first use. Flows without a group go last.
  function groups(flows) {
    var out = [], by = {}, other = [];
    flows.forEach(function (f) {
      var g = String(f.item.group || '').trim();
      if (!g) { other.push(f); return; }
      if (!by[g]) out.push(by[g] = { name: g, flows: [] });
      by[g].flows.push(f);
    });
    if (other.length) out.push({ name: out.length ? 'other' : '', flows: other });
    return out;
  }

  function statusClass(n) { return STATUS[n.status] ? ' st-' + n.status : ''; }

  // The bullets of an action as HTML, with the label of each (`Call:`, `Then:`, `Fail:`).
  function actionDetails(details) {
    var d = details || [];
    return d.length ? '<ul class="details">' + d.map(function (x) {
      var m = /^(Call|Then|Fail):\s*(.*)$/.exec(x);
      var h = m ? inline(m[2]) : inline(x);
      // A call to a flow of the mirror (`project/flow`) links to that flow.
      if (m && m[1] === 'Call') h = h.replace(/^<code>([a-z0-9_-]+\/[a-z0-9_.-]+)<\/code>/i, '<button type="button" class="call" data-goto="$1" title="Open $1">$1 \u2197</button>');
      return '<li>' + (m ? '<span class="meta">' + m[1] + '</span> ' + h : h) + '</li>';
    }).join('') + '</ul>' : '';
  }

  function matches(n, q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return false;
    return [n.title, n.sub, n.item && n.item.trigger].join('\n').toLowerCase().indexOf(q) >= 0;
  }

  // True when a project, or a flow or step in it, has a review status.
  function hasChanges(p) {
    return !!STATUS[p.status] || (p.flows || []).some(function (f) {
      return !!STATUS[f.status] || (f.steps || []).some(function (s) { return !!STATUS[s.status]; });
    });
  }

  // Line diff of two texts as HTML: old lines in <del>, new lines in <ins>, same lines in <span>.
  // ponytail: O(n*m) LCS table, fine for doc-sized texts; use Myers if docs grow to thousands of lines.
  function diffHtml(a, b) {
    a = String(a || '').split(/\r?\n/); b = String(b || '').split(/\r?\n/);
    var n = a.length, m = b.length, t = [], i, j;
    for (i = n; i >= 0; i--) {
      t[i] = [];
      for (j = m; j >= 0; j--) t[i][j] = i === n || j === m ? 0 : a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
    }
    var out = [], fence = false;
    function line(tag, s) {
      var r = diffLine(s, fence);
      if (/^\s*```/.test(s)) fence = !fence;
      out.push('<' + tag + r.cls + '>' + (r.html || ' ') + '</' + tag + '>');
    }
    for (i = 0, j = 0; i < n || j < m;) {
      if (i < n && j < m && a[i] === b[j]) { line('span', a[i]); i++; j++; }
      else if (j < m && (i === n || t[i][j + 1] >= t[i + 1][j])) line('ins', b[j++]);
      else line('del', a[i++]);
    }
    return '<div class="diff">' + out.join('') + '</div>';
  }

  // One markdown line of a diff as HTML: a heading, a list item, a code or table line, or text.
  function diffLine(s, fence) {
    var m;
    if (fence || /^\s*(```|\|)/.test(s)) return { cls: ' class="dc"', html: esc(s) };
    if ((m = /^#{1,6}\s+(.*)$/.exec(s))) return { cls: ' class="dh"', html: inline(m[1]) };
    if ((m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(s))) {
      return { cls: ' class="dl" style="--ind:' + Math.floor(m[1].length / 2) + '"',
        html: '<i>' + (/\d/.test(m[2]) ? esc(m[2]) : '•') + '</i>' + inline(m[3]) };
    }
    return { cls: '', html: inline(s) };
  }

  // The text of a part. `input` and `output` come from `flow.md`. Older data has no `input`,
  // `output` or `contract`, only `boundary`: the contract is the boundary, and `input` and
  // `output` are its example blocks before and after the `## Output` heading.
  function partSource(it, tab) {
    if (tab === 'contract') return it.contract !== undefined ? it.contract : it.boundary;
    if (tab !== 'input' && tab !== 'output') return it[tab];
    if (it[tab] !== undefined) return it[tab];
    var b = (it.contract !== undefined ? it.contract : it.boundary) || '', m = /^##[ \t]+Output\b.*$/m.exec(b);
    return examples(tab === 'input' ? (m ? b.slice(0, m.index) : b) : (m ? b.slice(m.index) : ''));
  }

  // Each fenced block of a markdown text, with its `Example …:` label line when it has one.
  function examples(md) {
    var lines = String(md || '').split(/\r?\n/), out = [], label = null;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (/^Example\b.*:$/.test(l.trim())) { label = l.trim(); continue; }
      if (/^\s*```/.test(l)) {
        var j = i + 1;
        while (j < lines.length && !/^\s*```\s*$/.test(lines[j])) j++;
        out.push((label ? label + '\n\n' : '') + lines.slice(i, j + 1).join('\n'));
        label = null;
        i = j;
      } else if (l.trim()) label = null;
    }
    return out.join('\n\n');
  }

  // The tabs of a flow or a page, one per file. A flow: the flow itself (its input, steps and
  // output), its full contract, and its rules. A page: its UI when it has a design picture, its
  // actions, its design, and its rules. A project has no tabs.
  function flowTabs(n) {
    var rules = { id: 'rules', label: 'Rules', parts: ['rules'] };
    if (n.type === 'flow') {
      return [{ id: 'flow', label: 'Flow', parts: ['input', 'steps', 'output'] }, { id: 'contract', label: 'Contract', parts: ['contract'] }, rules];
    }
    if (n.type !== 'page') return null;
    var ui = n.item.designSvg || n.item.designImage ? [{ id: 'ui', label: 'UI', parts: ['ui'] }] : [];
    return ui.concat([{ id: 'actions', label: 'Actions', parts: [n.unit === 'action' ? 'actions' : 'steps'] },
      { id: 'design', label: 'Design', parts: ['design'] }, rules]);
  }

  // The wireframes of a page: the main view (name '') from `design.svg`, then each variant from
  // `design-<name>.svg`.
  var UIV = '';
  function uiViews(it) { return [{ name: '', svg: it.designSvg }].concat(it.designVariants || []); }
  function viewSvg(it, name) {
    if (!it) return undefined;
    if (!name) return it.designSvg;
    var v = (it.designVariants || []).filter(function (x) { return x.name === name; })[0];
    return v ? v.svg : undefined;
  }
  function viewLabel(name) { return name ? name.charAt(0).toUpperCase() + name.slice(1).replace(/-/g, ' ') : 'Main'; }
  // When a variant shows: its bullet in `## Variants` of design.md, like ``- `guest`: the user is not signed in.``
  function variantNote(it, name) {
    if (!name) return '';
    var m = new RegExp('^\\s*[-*]\\s+`' + name.replace(/[^a-z0-9_-]/gi, '') + '`:\\s*(.+)$', 'mi').exec(it.design || '');
    return m ? m[1].trim() : '';
  }
  // The variations sheet of a view: `variations.svg` for the main view, `variations-<variant>.svg`
  // for a variant. Each `<g data-variation="<Component>: <variation>">` in it becomes a card.
  function varSvg(it, name) {
    var v = it && (it.designVariations || []).filter(function (x) { return x.name === (name || ''); })[0];
    return v ? v.svg : undefined;
  }
  function varChanged(it, name) {
    return !!it.old && it.old.designVariations !== undefined && varSvg(it.old, name) !== varSvg(it, name);
  }
  // The text of a component in `## Components` of design.md, like ``- `Button`: primary for "Pay".``
  function componentNote(it, comp) {
    var m = new RegExp('^\\s*[-*]\\s+`' + comp.replace(/[^a-z0-9_-]/gi, '') + '`:\\s*(.+)$', 'mi').exec(it.design || '');
    return m ? m[1].trim() : '';
  }

  // True when a view of the page changed on a review page.
  function viewChanged(it, name) {
    if (!it.old) return false;
    if (!name) return it.old.designSvg !== undefined && it.old.designSvg !== it.designSvg;
    return it.old.designVariants !== undefined && viewSvg(it.old, name) !== viewSvg(it, name);
  }

  // True when a part of a tab changed on a review page.
  function tabChanged(n, t) {
    var it = n.item;
    return t.parts.some(function (p) {
      if (p === 'ui') return uiViews(it).some(function (v) { return viewChanged(it, v.name) || varChanged(it, v.name); }) ||
        (!!it.old && it.old.designVariations !== undefined && (it.old.designVariations || []).some(function (v) { return varSvg(it, v.name) === undefined; })) ||
        (!!it.old && it.old.designVariants !== undefined && (it.old.designVariants || []).some(function (v) { return viewSvg(it, v.name) === undefined; }));
      if (p === 'steps' || p === 'actions') return (n.steps || []).some(function (s) { return !!STATUS[s.status]; });
      return !!it.old && tabText(Object.assign({}, it, it.old), p) !== tabText(it, p);
    });
  }

  // The text of a row tab, as the diff compares it. The definition tab also holds the frontmatter.
  function tabText(it, tab) {
    if (tab !== 'definition' || it.trigger === undefined) return partSource(it, tab) || '';
    return ['trigger: ' + (it.trigger || ''), 'entry: ' + (it.entry || ''), 'group: ' + (it.group || ''), '', it.definition || ''].join('\n');
  }

  function rowTabs(n) {
    // A page with a design picture shows it first, as its UI.
    var ui = n.item && (n.item.designSvg || n.item.designImage) ? ['ui'] : [];
    return n.type === 'project' ? ['definition'] : n.type === 'page' ? ['definition'].concat(ui, [n.unit === 'action' ? 'actions' : 'steps', 'design', 'rules'])
      : ['definition', 'input', 'steps', 'output', 'contract', 'rules'];
  }


  // The bullets under a step header. Old data has no details: its text holds them.
  function detailsHtml(s) {
    var d = s.details || [];
    return d.length ? '<ul class="details">' + d.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</ul>' : '';
  }

  function body(n, tab, folds) {
    var it = n.item;
    if (tab === 'steps' || tab === 'actions') {
      var steps = it.steps || [], act = tab === 'actions', tag = act ? 'ul' : 'ol';

  function actionName(x) { return String(x || '').replace(/\.$/, '').trim().toLowerCase(); }

  // The actions beside a design, each with where it goes. A grey action has no control in the design.

  // A line from the right side of each control, out of the design, along its own lane in the gap,

      var tab = part.getAttribute('data-part');
      commentTargets(part, f, tab).forEach(function (t) {
        var key = rk + '|' + tab + '|' + t.quote, id = state.ckeys.push({ key: key, pi: pi, fi: fi, where: rk + ', ' + t.where, quote: t.quote }) - 1;
        var c = state.comments[key], host = t.el.tagName === 'TR' ? t.el.lastElementChild : t.el;
        host.classList.add('cm');
        host.classList.toggle('has', !!c);
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'cbtn'; b.textContent = '\u{1F4AC}';
        b.title = c ? 'Edit the comment' : 'Comment'; b.setAttribute('aria-label', b.title);
        b.setAttribute('data-cmt', id);
        host.appendChild(b);
        if (!c && state.editing !== key) return;
        var step = t.el.parentNode.classList.contains('list'), note = document.createElement(step ? 'li' : 'div');
        note.className = 'cnote';
        note.setAttribute('data-cmt', id);
        if (state.editing === key) {
          note.innerHTML = '<textarea aria-label="Comment" placeholder="What should change here?"></textarea><div class="cact">' +
            '<button type="button" class="btn" data-csave="' + id + '">Save</button><button type="button" class="btn" data-ccancel="1">Cancel</button>' +
            (c ? '<button type="button" class="btn" data-cdel="' + id + '">Delete</button>' : '') + '</div>';
          note.firstChild.value = state.draft;
        } else {
          note.textContent = c.text;
          note.title = 'Edit the comment';
        }
        if (!step && (host.tagName === 'LI' || host.tagName === 'TD')) host.appendChild(note);
        else t.el.parentNode.insertBefore(note, t.el.nextSibling);
      });
    });
    var ta = $('view').querySelector('.cnote textarea');
    if (ta) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }

  function editComment(id) {
    var k = state.ckeys[id];
    if (!k) return;
    state.editing = k.key;
    state.draft = state.comments[k.key] ? state.comments[k.key].text : '';
    drawView();
  }

  function saveComment(id, text) {
    var k = state.ckeys[id];
    if (!k) return;
    var old = state.comments[k.key];
    if (String(text).trim()) {
      state.comments[k.key] = { pi: k.pi, fi: k.fi, seq: old ? old.seq : Date.now(), where: k.where, quote: k.quote, text: String(text).trim() };
    } else delete state.comments[k.key];
    saveComments();
    closeEditor();
  }

  function closeEditor() {
    state.editing = null;
    state.draft = '';
    drawView();
    updateCommentsButton();
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  function copyText(s, done) {
    function fallback() {
      var t = document.createElement('textarea'), ok = false;
      t.value = s; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(t);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(function () { done(true); }, fallback);
    else fallback();
  }

  function copyComments() {
    var list = commentList();
    if (!list.length) { toast('No comments yet. Open a flow and click \u{1F4AC} on a step or a rule.'); return; }
    var page = decodeURIComponent(location.pathname.split('/').pop() || 'review page');
    copyText(commentsText(page, list), function (ok) {
      toast(ok ? 'Copied ' + list.length + ' comment' + (list.length > 1 ? 's' : '') + '. Paste them to Claude.' : 'Could not copy. Your browser blocked the clipboard.');
    });
  }

  // Scroll an element into view and flash it.
  function reveal(e) {
    if (!e) return;
    e.scrollIntoView({ block: 'center', behavior: 'smooth' });
    e.classList.remove('flash');
    void e.offsetWidth;
    e.classList.add('flash');
  }

  // ---- Search ----

  // The sidebar shows the flows that match. Enter goes from match to match, in all projects.
  function search(q) {
    state.q = q;
    state.hits = q.trim() ? [].concat.apply([], state.models.map(function (m) {
      return m.all.filter(function (n) { return n.type !== 'project' && matches(n, q); });
    })) : [];
    state.hit = -1;
    if (state.hits.length) next(1);
    else draw();
  }

  function next(dir) {
    if (!state.hits.length) return;
    state.hit = (state.hit + dir + state.hits.length) % state.hits.length;
    var h = state.hits[state.hit], key = h.type === 'step' ? h.parentKey : h.key;
    if (key !== state.sel) open(key, { step: h.type === 'step' ? h.key : null });
    else {
      draw();
      if (h.type === 'step') revealStep(h.key); else reveal($('view').querySelector('.dtitle'));
    }
  }

  // ---- Wiring ----

  function fromHash() {
    var id = '';
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* bad hash */ }
    open(exists(id) ? id : state.sel || home());
  }

  function main() {
    applyTheme();
    if (media && media.addEventListener) media.addEventListener('change', applyTheme);
    state.data = JSON.parse($('mirror-data').textContent);
    state.models = (state.data.projects || []).map(model);
    document.body.classList.toggle('review', (state.data.projects || []).some(hasChanges));
    document.title = state.data.title || 'Mirror';
    $('title').textContent = state.data.title || 'Mirror';
    $('meta').textContent = state.data.generated ? 'generated ' + state.data.generated : '';
    loadComments();
    loadShut();
    loadRead();
    updateCommentsButton();
    initResize();
    initZoom();
    fromHash();

    $('side').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.id === 'changed-only') { state.changedOnly = !state.changedOnly; drawSide(); return; }
      if (b.hasAttribute('data-read')) { toggleRead(b.getAttribute('data-read')); return; }
      if (b.hasAttribute('data-read-filter')) { state.readFilter = b.getAttribute('data-read-filter'); drawSide(); return; }
      if (b.hasAttribute('data-group')) { toggleGroup(b.getAttribute('data-group')); return; }
      if (b.hasAttribute('data-go')) open(b.getAttribute('data-go'), { push: true });
    });
    $('view').addEventListener('click', function (e) {
      if (document.body.classList.contains('nav')) { document.body.classList.remove('nav'); $('menu').setAttribute('aria-expanded', 'false'); return; }
      var b = e.target.closest('button'), demo = e.target.closest('.demo [data-action]');
      if (demo) { followDemo(demo.getAttribute('data-action')); return; }
      if (!b) {
        var note = e.target.closest('.cnote[data-cmt]');
        if (note && !note.querySelector('textarea')) editComment(Number(note.getAttribute('data-cmt')));
        return;
      }
      if (b.hasAttribute('data-dver')) showVersion(b);
      else if (b.hasAttribute('data-act')) followDemo(b.getAttribute('data-act'));
      else if (b.hasAttribute('data-go')) open(b.getAttribute('data-go'), { push: true });
      else if (b.hasAttribute('data-goto')) open(b.getAttribute('data-goto'), { push: true });
      else if (b.hasAttribute('data-ftab')) showTab(b.getAttribute('data-ftab'));
      else if (b.hasAttribute('data-uiv')) showView(b.getAttribute('data-uiv'));
      else if (b.closest('.toc')) showPart(b.getAttribute('data-part'));
      else if (b.hasAttribute('data-fold-sec')) toggleSection(b.getAttribute('data-fold-sec'));
      else if (b.hasAttribute('data-cmt')) editComment(Number(b.getAttribute('data-cmt')));
      else if (b.hasAttribute('data-csave')) saveComment(Number(b.getAttribute('data-csave')), b.closest('.cnote').querySelector('textarea').value);
      else if (b.hasAttribute('data-cdel')) saveComment(Number(b.getAttribute('data-cdel')), '');
      else if (b.hasAttribute('data-ccancel')) closeEditor();
    });
    $('view').addEventListener('toggle', function (e) {
      var d = e.target, r = d.closest && d.closest('[data-row]');
      if (!r || !d.hasAttribute('data-fold')) return;
      var k = r.getAttribute('data-row');
      (state.folds[k] = state.folds[k] || {})[d.getAttribute('data-fold')] = d.open;
    }, true);
    $('view').addEventListener('mouseover', function (e) { lightWire(e, true); });
    $('view').addEventListener('mouseout', function (e) { lightWire(e, false); });
    $('view').addEventListener('focusin', function (e) { lightWire(e, true); });
    $('view').addEventListener('focusout', function (e) { lightWire(e, false); });
    $('view').addEventListener('input', function (e) { if (e.target.closest('.cnote')) state.draft = e.target.value; });
    $('view').addEventListener('keydown', function (e) {
      var note = e.target.tagName === 'TEXTAREA' && e.target.closest('.cnote');
      var demo = (e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.demo [data-action]');
      if (demo) { e.preventDefault(); followDemo(demo.getAttribute('data-action')); return; }
      if (!note) return;
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); note.querySelector('[data-csave]').click(); }
    });
    // A hash like #api/create-order opens that flow. pushState does not fire hashchange; back does.
    window.addEventListener('hashchange', fromHash);
    window.addEventListener('popstate', fromHash);
    $('q').addEventListener('input', function (e) { search(e.target.value); });
    $('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); next(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.target.value = ''; search(''); e.target.blur(); }
    });
    $('menu').addEventListener('click', function () {
      var on = document.body.classList.toggle('nav');
      $('menu').setAttribute('aria-expanded', String(on));
    });
    $('theme').addEventListener('click', toggleTheme);
    $('comments').addEventListener('click', copyComments);
    document.addEventListener('keydown', function (e) {
      var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
      if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); }
      else if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && /^(\+|=|-|0)$/.test(e.key) && !(e.target.closest && e.target.closest('#resize'))) {
        e.preventDefault();
        if (e.key === '0') setZoom(1, true); else zoomBy(e.key === '-' ? -1 : 1);
      }
    });
  }

  main();
})();
</script>
</body>
</html>
