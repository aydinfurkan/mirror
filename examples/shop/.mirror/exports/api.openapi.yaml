# Generated by mirror:export from .mirror/xsrc/api/. Change the mirror, then export again.
openapi: 3.1.0
info:
  title: api
  version: "2026-10-23"
  description: The `api` project is the HTTP API of the shop. It serves the products, creates the orders, and takes the payment events from Stripe.
tags:
  - name: orders
  - name: products
  - name: payments
paths:
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel a paid order, refund the payment with Stripe, and tell the other services.
      tags: [orders]
      description: |
        A customer can change their mind after the payment. The shop lets them cancel for 24 hours.

        Constraints:
        - A customer can cancel only a paid order, and only in the 24 hours after the order.
        - Give the money back before the order is cancelled.
        - Put the items back in the stock only after the order is cancelled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The order is cancelled and the refund exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { const: cancelled }
              example: { "id": "o1", "status": "cancelled" }
        "404":
          description: The order does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The order is not `paid`, or it is older than 24 hours.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { "error": { "code": "conflict", "message": "Only a paid order of the last 24 hours can be cancelled." } }
        "502":
          description: Stripe does not answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders:
    post:
      operationId: createOrder
      summary: Create an order from a cart and start the payment with Stripe.
      tags: [orders]
      description: |
        A customer clicks "Pay" on the checkout page. The shop saves the order and sends the customer to Stripe to pay.

        Constraints:
        - Use the current price of each item.
        - The order is not paid until Stripe confirms the payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, items]
              properties:
                email: { type: string, format: email }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, minLength: 1 }
                      quantity: { type: integer, minimum: 1, maximum: 10 }
            example: { "email": "ada@example.com", "items": [{ "productId": "p1", "quantity": 2 }] }
      responses:
        "201":
          description: The order is saved and the Stripe session exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }
                  sessionId: { type: string }
              example: { "orderId": "o1", "sessionId": "cs_test_a1b2" }
        "400":
          description: A field fails its validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A product is not for sale or has too little stock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { "error": { "code": "conflict", "field": "items", "message": "Blue mug has only 1 left." } }
        "502":
          description: Stripe does not answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Return one order with its status and its items.
      tags: [orders]
      description: |
        A customer comes back from the payment and wants to know if the order is paid.

        Constraints:
        - Show only the domain of the customer email, not the full email.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The order exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
              example: { "id": "o1", "status": "paid", "totalCents": 2400, "items": [{ "productId": "p1", "name": "Blue mug", "quantity": 2 }] }
        "404":
          description: The order does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { "error": { "code": "not-found", "message": "Order not found." } }
  /products/{id}:
    get:
      operationId: getProduct
      summary: Return one product with its details.
      tags: [products]
      description: |
        A customer opens one product to read about it before they add it to the cart.

        Constraints:
        - Do not show a product that is not for sale.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: The product exists and is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
                description: With `description`.
              example: { "id": "p1", "name": "Blue mug", "description": "A mug for tea.", "priceCents": 1200, "stock": 8 }
        "404":
          description: The product does not exist or is not active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { "error": { "code": "not-found", "message": "Product not found." } }
  /products:
    get:
      operationId: listProducts
      summary: List the products that are for sale.
      tags: [products]
      description: |
        A customer opens the shop. The page shows all the products that are for sale.

        Constraints:
        - Do not show a product that is not for sale.
        - A price change can take up to 60 seconds to show.
      responses:
        "200":
          description: Always. The list can be empty.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
              example: [{ "id": "p1", "name": "Blue mug", "priceCents": 1200, "stock": 8 }]
        "500":
          description: The database fails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { "error": { "code": "unexpected", "message": "Try again later." } }
  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      summary: Mark an order paid when Stripe says that the payment is complete.
      tags: [payments]
      description: |
        Stripe tells the shop when a customer pays. It is the only way an order becomes paid.

        Constraints:
        - Trust only a message that really comes from Stripe.
        - Stripe can send the same payment more than one time.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string, description: Stripe event type }
                data:
                  type: object
                  required: [object]
                  properties:
                    object:
                      type: object
                      required: [metadata]
                      properties:
                        metadata:
                          type: object
                          required: [orderId]
                          properties:
                            orderId: { type: string, description: For `checkout.session.completed`. }
            example: { "id": "evt_1", "type": "checkout.session.completed", "data": { "object": { "id": "cs_test_a1b2", "metadata": { "orderId": "o1" } } } }
      responses:
        "200":
          description: The event is handled or skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { const: true }
        "400":
          description: The signature is not valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { "error": { "code": "signature", "message": "Invalid signature." } }
components:
  schemas:
    Order:
      type: object
      required: [id, status, totalCents, items]
      properties:
        id: { type: string }
        status: { type: string }
        totalCents: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [productId, name, quantity]
            properties:
              productId: { type: string }
              name: { type: string }
              quantity: { type: integer }
    Product:
      type: object
      required: [id, name, priceCents, stock]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        stock: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            field: { type: string }
            message: { type: string }
