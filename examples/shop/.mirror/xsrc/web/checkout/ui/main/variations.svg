<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 320" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Checkout: variations</title>
<rect width="1360" height="320" fill="#ffffff"/>
<g data-variation="TextField email: empty"><text x="20" y="30" font-size="14" font-weight="600" fill="#09090b">Email</text><rect x="20" y="42" width="300" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="36" y="70" font-size="15" fill="#a1a1aa">you@example.com</text></g>
<g data-variation="TextField email: filled"><text x="360" y="30" font-size="14" font-weight="600" fill="#09090b">Email</text><rect x="360" y="42" width="300" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="376" y="70" font-size="15" fill="#09090b">anna@example.com</text></g>
<g data-variation="TextField email: focus"><text x="700" y="30" font-size="14" font-weight="600" fill="#09090b">Email</text><rect x="700" y="42" width="300" height="44" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="716" y="70" font-size="15" fill="#09090b">anna@example.com</text><rect x="698" y="40" width="304" height="48" rx="10" fill="none" stroke="#2563eb" stroke-opacity=".25" stroke-width="3"/></g>
<g data-variation="TextField email: error"><text x="1040" y="30" font-size="14" font-weight="600" fill="#09090b">Email</text><rect x="1040" y="42" width="300" height="44" rx="8" fill="#ffffff" stroke="#dc2626"/><text x="1056" y="70" font-size="15" fill="#09090b">anna@example</text><text x="1040" y="106" font-size="13" fill="#dc2626">Enter a valid email address.</text></g>
<g data-variation="Button &quot;Pay&quot;: default"><rect x="20" y="160" width="200" height="44" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="120.0" y="187" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Pay</text></g>
<g data-variation="Button &quot;Pay&quot;: hover"><rect x="260" y="160" width="200" height="44" rx="8" fill="#1d4ed8" stroke="#1d4ed8"/><text x="360.0" y="187" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Pay</text></g>
<g data-variation="Button &quot;Pay&quot;: disabled"><rect x="500" y="160" width="200" height="44" rx="8" fill="#e4e4e7" stroke="#e4e4e7"/><text x="600.0" y="187" font-size="15" font-weight="600" fill="#a1a1aa" text-anchor="middle">Pay</text></g>
<g data-variation="Button &quot;Pay&quot;: loading"><rect x="740" y="160" width="200" height="44" rx="8" fill="#93b4f5" stroke="#93b4f5"/><text x="840.0" y="187" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan dx="14">Paying…</tspan></text><circle cx="800" cy="182" r="8" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2.5"/><path d="M800 174 a8 8 0 0 1 8 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></g>
<g data-variation="Alert: error"><rect x="20" y="250" width="360" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/><circle cx="42" cy="272" r="8" fill="#dc2626"/><text x="42" y="277" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">!</text><text x="60" y="277" font-size="14" fill="#991b1b">Payment is not available.</text></g>
</svg>
