<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Order status: variations</title>
<rect width="700" height="330" fill="#ffffff"/>
<g data-variation="StatusBadge: paid"><rect x="20" y="20" width="110" height="36" rx="18" fill="#dcfce7" stroke="#bbf7d0"/><text x="75.0" y="44" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">Paid</text></g>
<g data-variation="Button &quot;Cancel order&quot;: default"><rect x="20" y="90" width="184" height="44" rx="8" fill="#ffffff" stroke="#a1a1aa"/><text x="112.0" y="117" font-size="15" font-weight="600" fill="#09090b" text-anchor="middle">Cancel order</text></g>
<g data-variation="Button &quot;Cancel order&quot;: hover"><rect x="240" y="90" width="184" height="44" rx="8" fill="#f4f4f5" stroke="#71717a"/><text x="332.0" y="117" font-size="15" font-weight="600" fill="#09090b" text-anchor="middle">Cancel order</text></g>
<g data-variation="Button &quot;Cancel order&quot;: loading"><rect x="460" y="90" width="184" height="44" rx="8" fill="#f4f4f5" stroke="#d4d4d8"/><text x="552.0" y="117" font-size="15" font-weight="600" fill="#a1a1aa" text-anchor="middle"><tspan dx="14">Cancelling…</tspan></text><circle cx="500" cy="112" r="8" fill="none" stroke="#a1a1aa" stroke-opacity=".35" stroke-width="2.5"/><path d="M500 104 a8 8 0 0 1 8 8" fill="none" stroke="#a1a1aa" stroke-width="2.5" stroke-linecap="round"/></g>
<g data-variation="ConfirmDialog: open"><rect x="20" y="170" width="380" height="140" rx="12" fill="#ffffff" stroke="#e4e4e7"/><text x="44" y="210" font-size="17" font-weight="700" fill="#09090b">Cancel this order?</text><rect x="160" y="246" width="108" height="44" rx="8" fill="#ffffff" stroke="#a1a1aa"/><text x="214.0" y="273" font-size="15" font-weight="600" fill="#09090b" text-anchor="middle">Keep order</text><rect x="276" y="246" width="108" height="44" rx="8" fill="#dc2626" stroke="#dc2626"/><text x="330.0" y="273" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Cancel order</text></g>
</svg>
