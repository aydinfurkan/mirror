<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror</title>
<style>
/* MIRROR:TOKENS:START */
:root {
  --bg: #f6f7f9;  --grid: #d5dae1;  --surface: #ffffff;  --panel: #ffffff;  --border: #e4e7ec;
  --text: #111827;  --muted: #6b7280;  --edge: #c3cad4;  --accent: #4f6bff;
  --shadow: drop-shadow(0 1px 1px rgb(16 24 40 / .05)) drop-shadow(0 4px 10px rgb(16 24 40 / .07));
  --project: #4f6bff;  --flow: #12a37a;  --page: #d98a1c;  --step: #94a3b8;
  --added: #16a34a;  --changed: #d97706;  --removed: #dc2626;
  --box-w: 240px;  --box-h: 64px;  --gap-x: 96px;  --gap-y: 20px;  --radius: 12px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0b0d12;  --grid: #222835;  --surface: #151922;  --panel: #11151c;  --border: #262c38;
  --text: #e6e9ef;  --muted: #8b93a3;  --edge: #3a4252;  --accent: #7b8cff;
  --shadow: drop-shadow(0 1px 1px rgb(0 0 0 / .4)) drop-shadow(0 6px 14px rgb(0 0 0 / .35));
  --project: #7b8cff;  --flow: #34d399;  --page: #fbbf24;  --step: #64748b;
  --added: #22c55e;  --changed: #f59e0b;  --removed: #f87171;
}
/* MIRROR:TOKENS:END */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 15px; font-weight: 650; margin: 0; white-space: nowrap; }
.brand h1::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; background: linear-gradient(135deg, var(--project), var(--flow)); }
.meta { color: var(--muted); font-size: 12px; }
.search { position: relative; flex: 1; max-width: 420px; margin: 0 auto; }
.search input { width: 100%; height: 34px; padding: 0 56px 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search .count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.tools { display: flex; gap: 6px; }
.btn { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tab:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#canvas { position: absolute; inset: 0; cursor: grab; touch-action: none; background-color: var(--bg); background-image: radial-gradient(var(--grid) 1px, transparent 1.3px); }
#canvas.panning { cursor: grabbing; }
#canvas svg { display: block; width: 100%; height: 100%; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.node { cursor: pointer; outline: none; }
.node.project { --c: var(--project); }
.node.flow { --c: var(--flow); }
.node.page { --c: var(--page); }
.node.step { --c: var(--step); }
.node .card { fill: var(--surface); stroke: var(--border); stroke-width: 1; filter: var(--shadow); transition: stroke .15s; }
.node:hover .card { stroke: var(--c); }
.node .bar { fill: var(--c); }
.node text { pointer-events: none; }
.node .title { fill: var(--text); font-size: 13px; font-weight: 600; }
.node .sub { fill: var(--muted); font: 11px var(--mono); }
.node .badge rect { fill: var(--c); opacity: .15; }
.node .badge text { fill: var(--c); font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.node .num circle { fill: color-mix(in srgb, var(--c) 20%, transparent); }
.node .num text { fill: var(--text); font-size: 11px; font-weight: 700; }
.node.sel .card, .node:focus-visible .card, .node.match .card { stroke: var(--accent); stroke-width: 2; }
.node.current .card { stroke-width: 3; filter: var(--shadow) drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)); }
.node.st-added .card { stroke: var(--added); stroke-width: 2.5; }
.node.st-changed .card { stroke: var(--changed); stroke-width: 2.5; }
.node.st-removed { opacity: .55; }
.node.st-removed .card { stroke: var(--removed); stroke-width: 2.5; stroke-dasharray: 6 4; }
.toggle { cursor: pointer; outline: none; }
.toggle circle { fill: var(--surface); stroke: var(--border); }
.toggle:hover circle, .toggle:focus-visible circle { stroke: var(--accent); stroke-width: 2; }
.toggle text { fill: var(--muted); font-size: 11px; font-weight: 700; }
.float { position: absolute; display: flex; gap: 6px; align-items: center; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .08); }
#zoom { left: 16px; bottom: 16px; }
#zoom .btn { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 8px; }
#zoom .pct { min-width: 44px; text-align: center; }
#legend { right: 16px; bottom: 16px; display: none; gap: 14px; padding: 8px 12px; font-size: 12px; }
#legend.on { display: flex; }
#legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); }
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgb(0 0 0 / .08); transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility .2s; z-index: 3; }
#drawer.open { transform: none; visibility: visible; }
.dh { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 10px; }
.dh h2 { font-size: 16px; line-height: 1.35; margin: 6px 0 2px; overflow-wrap: anywhere; }
.dh > div { flex: 1; min-width: 0; }
.dh .close { flex: none; }
.chip { display: inline-block; margin-right: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .03em; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.ptabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; }
.ptabs:empty { display: none; }
.ptab { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; }
.ptab small { font-weight: 400; font-size: 11px; }
.ptab.on { color: var(--text); border-bottom-color: var(--accent); }
.ptab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--changed); }
.db { flex: 1; overflow: auto; padding: 12px 16px 24px; }
.db h4, .db h5, .db h6 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.db code { font: 12px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); }
.db pre { padding: 10px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
.db pre code { padding: 0; border: 0; }
.db ul, .db ol { padding-left: 20px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list li > div { flex: 1; min-width: 0; }
.list .n { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; border: 1px solid var(--border); background: var(--bg); }
.ref { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.ref code { min-width: 0; overflow-wrap: anywhere; }
.copy { flex: none; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 11px; }
.link { padding: 0; border: 0; background: none; color: var(--accent); text-align: left; cursor: pointer; }
.empty { color: var(--muted); }
@media (max-width: 700px) {
  header { flex-wrap: wrap; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  #legend { bottom: 64px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="title">Mirror</h1><span class="meta" id="meta"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search flows, steps, code  ( / )" aria-label="Search" autocomplete="off">
    <span class="meta count" id="qcount"></span>
  </div>
  <div class="tools">
    <button class="btn" id="collapse-all" title="Hide all steps">Collapse</button>
    <button class="btn" id="expand-all" title="Show all steps">Expand</button>
    <button class="btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">&#9680;</button>
  </div>
</header>
<nav class="ptabs" id="ptabs" role="tablist" aria-label="Projects"></nav>
<main>
  <div id="canvas"></div>
  <div class="float" id="zoom">
    <button class="btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
    <span class="meta pct" id="zoom-pct">100%</span>
    <button class="btn" id="zoom-in" aria-label="Zoom in">+</button>
    <button class="btn" id="fit">Fit</button>
  </div>
  <div class="float" id="legend">
    <span style="--c: var(--added)">added</span>
    <span style="--c: var(--changed)">changed</span>
    <span style="--c: var(--removed)">removed</span>
  </div>
  <aside id="drawer" aria-hidden="true"></aside>
</main>
<script type="application/json" id="mirror-data">
{"generated":"","title":"Mirror","projects":[]}
</script>
<script id="mirror-app">
(function () {
  'use strict';

    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Headings, bullet and numbered lists, code fences, paragraphs. Input is escaped first.
  function renderMd(text) {

        return;
      }

      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {

    var tip = el('title', {});
    tip.textContent = n.title + (n.sub ? '\n' + n.sub : '');
    ge.appendChild(tip);
    if (n.count) {
      var tg = el('g', { 'class': 'toggle', transform: 'translate(' + w + ',' + (h / 2 + 2) + ')', tabindex: 0, role: 'button',
        'data-toggle': n.key, 'aria-label': (n.collapsed ? 'Show steps of ' : 'Hide steps of ') + n.title });
      tg.appendChild(el('circle', { r: 11 }));
      tg.appendChild(txt(n.collapsed ? String(n.count) : '\u2212', { y: 4, 'text-anchor': 'middle' }));
      ge.appendChild(tg);
    }
    return ge;
  }

  // Each project has its own tab; the graph shows one project at a time.
  function current() { return { projects: (state.data.projects || []).slice(state.pi, state.pi + 1) }; }

  function renderTabs() {
    var projects = state.data.projects || [];
    $('ptabs').innerHTML = projects.map(function (p, i) {
      var on = i === state.pi;
      return '<button class="ptab' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '" tabindex="' + (on ? 0 : -1) +
        '" data-pi="' + i + '">' + esc(p.id) + ' <small>' + esc((p.kinds || []).join(' · ')) + '</small>' +
        (hasChanges(p) ? '<span class="dot" title="Has changes"></span>' : '') + '</button>';
    }).join('');
  }

  function switchProject(i, focus) {
    var projects = state.data.projects || [];
    if (i < 0 || i >= projects.length) return;
    closeDrawer();
    state.pi = i;
    state.hit = -1;
    try { history.replaceState(null, '', '#' + encodeURIComponent(projects[i].id)); } catch (e) { /* file:// in some browsers */ }
    renderTabs();
    draw();
    initialView();
    if (focus) $('ptabs').querySelector('.ptab.on').focus();
  }

  function projectFromHash() {
    var id = decodeURIComponent(location.hash.slice(1));
    var i = (state.data.projects || []).map(function (p) { return p.id; }).indexOf(id);
    return i < 0 ? 0 : i;
  }

  function draw() {
    var t = state.t, g = state.g = layout(current(), t, state.collapsed), root = state.root;
    state.byKey = {};
    g.nodes.forEach(function (n) { state.byKey[n.key] = n; });
    state.hits = g.nodes.filter(function (n) { return matches(n, state.q); });
    if (state.hit >= state.hits.length) state.hit = state.hits.length - 1;
    var hitKeys = {}, cur = state.hits[state.hit];
    state.hits.forEach(function (n) { hitKeys[n.key] = true; });
    while (root.firstChild) root.removeChild(root.firstChild);
    g.edges.forEach(function (e) {
      var a = e[0], b = e[1], x1 = a.x + t.boxW, y1 = a.y + t.boxH / 2 + 2, x2 = b.x, y2 = b.y + t.boxH / 2 + 2, mx = (x1 + x2) / 2;
      root.appendChild(el('path', { 'class': 'edge', d: 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2 }));
    });
    g.nodes.forEach(function (n) { root.appendChild(card(n, hitKeys[n.key], cur === n)); });
    $('qcount').textContent = state.q.trim() ? (state.hits.length ? (state.hit + 1) + '/' + state.hits.length : '0') : '';
    $('legend').classList.toggle('on', g.nodes.some(function (n) { return STATUS[n.status]; }));
  }

  function refocus(attr, key) {
    var e = state.root.querySelector(sel(attr, key));
    if (e) e.focus();
  }

  function toggleFlow(key, keyboard) {
    state.collapsed[key] = !state.collapsed[key];
    if (state.open && state.open.parentKey === key) closeDrawer();
    draw();
    if (keyboard) refocus('data-toggle', key);
  }

  function setAll(shut) {
    state.collapsed = {};
    if (shut) state.g.nodes.forEach(function (n) { if (n.count) state.collapsed[n.key] = true; });
    if (shut && state.open && state.open.type === 'step') closeDrawer();
    draw();
    fit();
  }

  function select(key, center) {
    var n = state.byKey[key];
    if (!n) return;
    var old = state.sel && state.root.querySelector(sel('data-key', state.sel));
    if (old) old.classList.remove('sel');
    state.sel = key;
    var ge = state.root.querySelector(sel('data-key', key));
    if (ge) ge.classList.add('sel');
    openDrawer(n);
    if (center) centerOn(n);
  }

  function goto(key) {
    if (!state.byKey[key] && key.indexOf('#') > 0) {
      delete state.collapsed[key.split('#')[0]];
      draw();
    }
    select(key, true);
  }

  // ---- Search ----

  function search(q) {
    state.q = q;
    if (q.trim()) {
      current().projects.forEach(function (p) {
        (p.flows || []).forEach(function (f) {
          var hidden = (f.steps || []).some(function (s) { return matches({ title: s.n + '. ' + s.text, sub: s.ref }, q); });
          if (hidden) delete state.collapsed[p.id + '/' + f.id];
        });
      });
    }
    state.hit = -1;
    draw();
    if (state.hits.length) next(1);
  }

  function next(dir) {
    if (!state.hits.length) return;
    state.hit = (state.hit + dir + state.hits.length) % state.hits.length;
    draw();
    centerOn(state.hits[state.hit]);
  }

  // ---- Drawer ----

  function refHtml(ref) {
    return ref ? '<div class="ref"><code>' + esc(ref) + '</code><button class="btn copy" data-copy="' + esc(ref) + '">Copy</button></div>' : '';
  }

  function body(n, tab) {
    var it = n.item;
    if (tab === 'step') {
      return '<h5>Code</h5>' + (refHtml(it.ref) || '<p class="empty">No code reference.</p>') +
        '<h5>Flow</h5><p><button class="link" data-goto="' + esc(n.parentKey) + '">' + esc(n.parent.id) + '</button></p>';
    }
    if (tab === 'flows') {
      var flows = it.flows || [];
      return flows.length ? '<ol class="list">' + flows.map(function (f) {
        return '<li><div><button class="link" data-goto="' + esc(it.id + '/' + f.id) + '">' + esc(f.id) + '</button>' +
          '<div class="meta">' + esc([BADGE[f.trigger], f.entry].filter(Boolean).join(' \u00b7 ')) + '</div></div></li>';
      }).join('') + '</ol>' : '<p class="empty">No flows.</p>';
    }
    if (tab === 'steps') {
      var steps = it.steps || [];
      return steps.length ? '<ol class="list">' + steps.map(function (s, i) {
        return '<li><span class="n">' + esc(s.n) + '</span><div><button class="link" data-goto="' + esc(n.key + '#' + i) + '">' +
          inline(s.text) + '</button>' + refHtml(s.ref) + '</div></li>';
      }).join('') + '</ol>' : '<p class="empty">No steps.</p>';
    }
    return it[tab] ? renderMd(it[tab]) : '<p class="empty">Nothing here yet.</p>';
  }

  function openDrawer(n) {
    var tabs = n.type === 'project' ? ['definition', 'flows'] : n.type === 'step' ? [] : ['definition', 'steps', 'boundary', 'rules'];
    if (tabs.length && tabs.indexOf(state.tab) < 0) state.tab = tabs[0];
    var h = ['<div class="dh"><div>', '<span class="chip" style="--c: var(--' + n.type + ')">' + esc(n.badge || n.type.toUpperCase()) + '</span>'];
    if (STATUS[n.status]) h.push('<span class="chip" style="--c: var(--' + n.status + ')">' + n.status + '</span>');
    h.push('<h2>' + esc(n.label) + '</h2>');
    if (n.sub && n.type !== 'step') h.push('<div class="meta">' + esc(n.sub) + '</div>');
    h.push('</div><button class="btn close" data-close aria-label="Close">\u00d7</button></div>');
    if (tabs.length) {
      h.push('<div class="tabs" role="tablist">' + tabs.map(function (k) {
        return '<button class="tab' + (k === state.tab ? ' on' : '') + '" role="tab" aria-selected="' + (k === state.tab) + '" data-tab="' + k + '">' +
          k.charAt(0).toUpperCase() + k.slice(1) + '</button>';
      }).join('') + '</div>');
    }
    h.push('<div class="db">' + body(n, tabs.length ? state.tab : 'step') + '</div>');
    var d = $('drawer');
    d.innerHTML = h.join('');
    d.classList.add('open');
    d.setAttribute('aria-hidden', 'false');
    state.open = n;
  }

  function closeDrawer() {
    var d = $('drawer');
    d.classList.remove('open');
    d.setAttribute('aria-hidden', 'true');
    var old = state.sel && state.root.querySelector(sel('data-key', state.sel));
    if (old) old.classList.remove('sel');
    state.sel = null;
    state.open = null;
  }

  function copy(value, btn) {
    function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = value;
      document.body.appendChild(ta);
      ta.select();
      try { if (document.execCommand('copy')) done(); } catch (e) { /* no clipboard */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(value).then(done, fallback);
    else fallback();
  }

  // ---- Wiring ----

  function activate(target, keyboard) {
    var tg = target.closest('[data-toggle]');
    if (tg) { toggleFlow(tg.getAttribute('data-toggle'), keyboard); return true; }
    var node = target.closest('.node');
    if (node) { select(node.getAttribute('data-key'), false); return true; }
    return false;
  }

  function main() {
    applyTheme();
    if (media && media.addEventListener) media.addEventListener('change', applyTheme);
    state.data = JSON.parse($('mirror-data').textContent);
    document.title = state.data.title || 'Mirror';
    $('title').textContent = state.data.title || 'Mirror';
    $('meta').textContent = state.data.generated ? 'generated ' + state.data.generated : '';
    var t = state.t = tokens();
    var svg = el('svg', { role: 'group', 'aria-label': 'Flow graph' }), defs = el('defs', {}), cp = el('clipPath', { id: 'card-clip' });
    cp.appendChild(el('rect', { width: t.boxW, height: t.boxH, rx: t.radius }));
    defs.appendChild(cp);
    svg.appendChild(defs);
    state.root = el('g', {});
    svg.appendChild(state.root);
    var c = $('canvas');
    c.appendChild(svg);
    state.pi = projectFromHash();
    renderTabs();
    draw();
    initialView();
    bindCanvas(c);

    svg.addEventListener('click', function (e) { if (!state.dragged) activate(e.target, false); });
    svg.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (activate(e.target, true)) e.preventDefault();
    });
    $('drawer').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-close')) closeDrawer();
      else if (b.hasAttribute('data-tab')) { state.tab = b.getAttribute('data-tab'); openDrawer(state.open); }
      else if (b.hasAttribute('data-copy')) copy(b.getAttribute('data-copy'), b);
      else if (b.hasAttribute('data-goto')) goto(b.getAttribute('data-goto'));
    });
    $('ptabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-pi]');
      if (b) switchProject(Number(b.getAttribute('data-pi')), false);
    });
    $('ptabs').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') switchProject(state.pi + 1, true);
      else if (e.key === 'ArrowLeft') switchProject(state.pi - 1, true);
    });
    window.addEventListener('hashchange', function () {
      var i = projectFromHash();
      if (i !== state.pi) switchProject(i, false);
    });
    $('q').addEventListener('input', function (e) { search(e.target.value); });
    $('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); next(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.target.value = ''; search(''); e.target.blur(); }
    });
    $('collapse-all').addEventListener('click', function () { setAll(true); });
    $('expand-all').addEventListener('click', function () { setAll(false); });
    $('theme').addEventListener('click', toggleTheme);
    $('zoom-in').addEventListener('click', function () { zoomBy(1.25); });
    $('zoom-out').addEventListener('click', function () { zoomBy(0.8); });
    $('fit').addEventListener('click', fit);
    document.addEventListener('keydown', function (e) {
      var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
      if (e.key === 'Escape' && state.open) closeDrawer();
      else if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); }
    });
  }

  main();
})();
</script>
</body>
</html>
