<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* MIRROR:TOKENS:START */
:root {
  --bg: #fafafa;  --surface: #ffffff;  --panel: #ffffff;  --border: #e4e4e7;
  --text: #09090b;  --muted: #52525b;  --edge: #a1a1aa;  --accent: #09090b;
  --shadow: 0 0 #0000;
  --project: #09090b;  --flow: #2563eb;  --page: #d97706;  --step: #71717a;  --group: #3f3f46;  --external: #7c3aed;
  --added: #16a34a;  --changed: #eab308;  --removed: #dc2626;
  --box-w: 340px;  --box-h: 112px;  --gap-x: 20px;  --gap-y: 56px;  --radius: 14px;
  --font: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #09090b;  --surface: #18181b;  --panel: #111113;  --border: #27272a;
  --text: #fafafa;  --muted: #a1a1aa;  --edge: #52525b;  --accent: #fafafa;
  --shadow: 0 0 #0000;
  --project: #fafafa;  --flow: #60a5fa;  --page: #fbbf24;  --step: #71717a;  --group: #52525b;  --external: #a78bfa;
  --added: #22c55e;  --changed: #facc15;  --removed: #f87171;
}
/* MIRROR:TOKENS:END */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 18px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 19px; font-weight: 650; margin: 0; white-space: nowrap; }
.brand h1::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; background: linear-gradient(135deg, var(--project), var(--flow)); }
.meta { color: var(--muted); font-size: 14px; }
.search { position: relative; flex: 1; max-width: 420px; margin: 0 auto; }
.search input { width: 100%; height: 34px; font-size: 15px; padding: 0 56px 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search .count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.tools { display: flex; gap: 6px; font-size: 15px; }
.btn { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tab:focus-visible, .link:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ptabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; }
.ptabs:empty { display: none; }
.ptab { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; }
.ptab small { font-weight: 400; font-size: 13px; }
.ptab.on { color: var(--text); border-bottom-color: var(--accent); }
.ptab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ptab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--changed); }
main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#canvas { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background-color: var(--bg); }
#canvas.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.row { display: flex; align-items: flex-start; justify-content: flex-start; gap: calc(var(--gap-x) * 2); }
.row + .row { margin-top: var(--gap-y); }
.row.groups { flex-direction: column; align-items: flex-start; gap: calc(var(--gap-y) / 2); padding-left: 32px; }
.group { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 14px; background: color-mix(in srgb, var(--group) 7%, transparent); border: 1.5px solid color-mix(in srgb, var(--group) 45%, transparent); border-radius: var(--radius); }
.gh { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--group); color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.gh small { min-width: 18px; padding: 1px 6px; border-radius: 999px; background: rgb(255 255 255 / .25); font-size: 15px; text-align: center; letter-spacing: 0; }
:root[data-theme="dark"] .gh { color: #111827; }
:root[data-theme="dark"] .gh small { background: rgb(0 0 0 / .18); }
.gflows { display: flex; align-items: flex-start; gap: var(--gap-x); }
.empty-state { padding: 40px; color: var(--muted); }
/* Cards */
.card { flex: none; width: var(--box-w); min-height: var(--box-h); padding: 14px 16px 16px; background: var(--surface); border: 2px solid var(--c); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; outline: none; transition: border-color .15s, box-shadow .15s; }
.card.project { --c: var(--project); }
.card.flow { --c: var(--flow); }
.card.page { --c: var(--page); }
.card.external { --c: var(--external, #7c3aed); }
.lchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.lchip { max-width: 100%; padding: 1px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); font: 14px var(--mono); color: var(--muted); text-align: left; overflow-wrap: anywhere; cursor: pointer; }
.lchip:hover, .lchip:focus-visible { color: var(--text); border-color: var(--accent); outline: none; }
.row.system { gap: calc(var(--gap-x) * 3); }
.row.system.top { margin-top: 110px; }
.row.system + .row.system { margin-top: calc(var(--gap-y) * 2); }
.edge.st-added { stroke: var(--added); stroke-width: 2.5; }
.edge.st-removed { stroke: var(--removed); stroke-width: 2.5; stroke-dasharray: 6 4; }
.arrow { fill: var(--edge); }
.elabel { font: 14px var(--font); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.card:hover { border-color: var(--c); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.name { font-size: 17px; font-weight: 650; overflow-wrap: anywhere; }
.badge { flex: none; padding: 1px 7px; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.sub { margin-top: 2px; font: 15px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.def { margin: 8px 0 0; font-size: 16.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card code { font: 15px var(--mono); }
.toggle { display: block; margin-top: 8px; padding: 2px 0; border: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 600; cursor: pointer; }
.steps { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--border); }
.step { display: flex; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); border-radius: 6px; font-size: 16px; line-height: 1.4; outline: none; }
.steps.enter .step { animation: step-in .28s ease-out both; animation-delay: calc(var(--i) * 45ms); }
@keyframes step-in { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .steps.enter .step { animation: none; } }
.step:last-child { border-bottom: 0; }
.step:hover { background: var(--bg); }
.step .n { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--c) 18%, transparent); }
.step .body { min-width: 0; }
.card.sel, .card:focus-visible, .card.match { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
.card.current { box-shadow: var(--shadow), 0 0 0 3px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); }
.step.sel, .step:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.step.match { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.review .card { background: transparent; border-color: var(--text); box-shadow: none; --c: var(--text); }
.card.st-added { --c: var(--added); border-color: var(--added); background: color-mix(in srgb, var(--added) 16%, var(--surface)); box-shadow: var(--shadow), 0 0 0 2px var(--added); }
.card.st-changed { --c: var(--changed); border-color: var(--changed); background: color-mix(in srgb, var(--changed) 18%, var(--surface)); box-shadow: var(--shadow), 0 0 0 2px var(--changed); }
.card.st-removed { --c: var(--removed); border-color: var(--removed); box-shadow: 0 0 0 2px var(--removed);
  background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--removed) 22%, transparent) 0 2px, transparent 2px 10px),
    repeating-linear-gradient(-45deg, color-mix(in srgb, var(--removed) 22%, transparent) 0 2px, transparent 2px 10px),
    color-mix(in srgb, var(--removed) 8%, var(--surface)); }
.diff { margin: 0; padding: 8px 0; font: 16px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.diff span, .diff del, .diff ins { display: block; padding: 0 6px; border-radius: 4px; }
.diff del { text-decoration: line-through; color: var(--removed); background: color-mix(in srgb, var(--removed) 10%, transparent); }
.diff ins { text-decoration: none; background: color-mix(in srgb, var(--changed) 35%, transparent); }
.step.st-added, .list .st-added { background: color-mix(in srgb, var(--added) 14%, transparent); }
.step.st-changed, .list .st-changed { background: color-mix(in srgb, var(--changed) 14%, transparent); }
.step.st-removed, .list .st-removed { opacity: .6; text-decoration: line-through; background: color-mix(in srgb, var(--removed) 10%, transparent); }
/* Floating controls */
.float { position: absolute; display: flex; gap: 6px; align-items: center; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .08); }
#zoom { left: 16px; bottom: 16px; }
#zoom .btn { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 8px; }
#zoom .pct { min-width: 44px; text-align: center; }
#legend { right: 16px; bottom: 16px; display: none; gap: 14px; padding: 8px 12px; font-size: 16px; }
#legend.on { display: flex; }
#legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); }
/* Drawer */
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 100%); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgb(0 0 0 / .08); transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility .2s; z-index: 3; }
#drawer.open { transform: none; visibility: visible; }
.dh { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 10px; }
.dh h2 { font-size: 20px; line-height: 1.35; margin: 6px 0 2px; overflow-wrap: anywhere; }
.dh > div { flex: 1; min-width: 0; }
.dh .close { flex: none; }
.chip { display: inline-block; margin-right: 4px; padding: 1px 8px; border-radius: 999px; font-size: 15px; font-weight: 700; letter-spacing: .03em; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.db { flex: 1; overflow: auto; padding: 12px 16px 24px; }
.db h4, .db h5, .db h6 { margin: 18px 0 6px; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.db code { font: 16px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); }
.db pre { padding: 10px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
.db pre code { padding: 0; border: 0; }
.db ul, .db ol { padding-left: 20px; }
.db table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 17px; }
.db th, .db td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.db th { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list li > div { flex: 1; min-width: 0; }
.details { margin: 4px 0 0; padding-left: 18px; }
.list .details li { display: list-item; padding: 2px 0; border: 0; }
.list .n { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 15px; font-weight: 700; border: 1px solid var(--border); background: var(--bg); }
.coderef { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.coderef code { min-width: 0; overflow-wrap: anywhere; }
.copy { flex: none; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 15px; }
.link { padding: 0; border: 0; background: none; color: var(--accent); text-align: left; cursor: pointer; }
.empty { color: var(--muted); }
@media (max-width: 700px) {
  header { flex-wrap: wrap; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  #legend { bottom: 64px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="title">Mirror</h1><span class="meta" id="meta"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search flows, steps, code  ( / )" aria-label="Search" autocomplete="off">
    <span class="meta count" id="qcount"></span>
  </div>
  <div class="tools">
    <button class="btn" id="collapse-all" title="Hide all steps">Collapse</button>
    <button class="btn" id="expand-all" title="Show all steps">Expand</button>
    <button class="btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">&#9680;</button>
  </div>
</header>
<nav class="ptabs" id="ptabs" role="tablist" aria-label="Projects"></nav>
<main>
  <div id="canvas"><div id="world"></div></div>
  <div class="float" id="zoom">
    <button class="btn" id="zoom-out" aria-label="Zoom out">&minus;</button>
    <span class="meta pct" id="zoom-pct">100%</span>
    <button class="btn" id="zoom-in" aria-label="Zoom in">+</button>
    <button class="btn" id="fit">Fit</button>
  </div>
  <div class="float" id="legend">
    <span style="--c: var(--added)">added</span>
    <span style="--c: var(--changed)">changed</span>
    <span style="--c: var(--removed)">removed</span>
  </div>
  <aside id="drawer" aria-hidden="true"></aside>
</main>
<script type="application/json" id="mirror-data">
{"generated":"","title":"Mirror","projects":[]}
</script>
<script id="mirror-app">
(function () {
  'use strict';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }

  // Headings, bullet and numbered lists, tables, code fences, paragraphs. Input is escaped first.
  function renderMd(text) {
    var out = [], list = null, code = null;
    function closeList() {
      if (list) { out.push(list === 'table' ? '</tbody></table>' : '</' + list + '>'); list = null; }
    }
    function openList(tag) { if (list !== tag) { closeList(); list = tag; out.push('<' + tag + '>'); } }
    function cells(line, tag) {
      return '<tr>' + line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) {
        return '<' + tag + '>' + inline(c.trim()) + '</' + tag + '>';
      }).join('') + '</tr>';
    }
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var m;
      if (code !== null) {
        if (/^```/.test(line)) { out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); code = null; }
        else code.push(line);
        return;
      }
      if (/^\s*\|/.test(line)) {
        if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) return; // separator row
        if (list === 'table') { out.push(cells(line, 'td')); return; }
        closeList();
        list = 'table';
        out.push('<table><thead>' + cells(line, 'th') + '</thead><tbody>');
        return;
      }
      if (/^```/.test(line)) { closeList(); code = []; return; }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
        closeList();
        var lv = Math.min(m[1].length + 3, 6);
        out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>');
        return;
      }
      if ((m = /^\s*[-*]\s+(.*)$/.exec(line))) { openList('ul'); out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if ((m = /^\s*\d+\.\s+(.*)$/.exec(line))) { openList('ol'); out.push('<li>' + inline(m[1]) + '</li>'); return; }
      closeList();
      if (line.trim()) out.push('<p>' + inline(line) + '</p>');
    });
    closeList();
    if (code !== null) out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
    return out.join('');
  }

  // The first plain paragraph of a markdown text: the short definition shown on a card.
  function summary(md) {
    var out = [];
    String(md || '').split(/\r?\n/).some(function (line) {
      var s = line.trim();
      if (!s || /^(#|[-*]\s|\d+\.\s|\||```)/.test(s)) return out.length > 0;
      out.push(s);
      return false;
    });
    return out.join(' ');
  }

  var BADGE = { http: 'HTTP', main: 'MAIN', message: 'MSG', schedule: 'CRON', page: 'PAGE' };
  var STATUS = { added: 1, changed: 1, removed: 1 };

  function projectNode(p) {
    return { key: p.id, type: 'project', title: p.id, label: p.id, sub: (p.kind || ''),
      badge: 'PROJECT', status: p.status || null, item: p };
  }

  // One project as cards: the project, its flows, and the steps inside each flow.
  // The build puts the links of each flow in `out` and `into`.
  function model(p) {
    var pn = projectNode(p);
    var all = [pn];
    var flows = (p.flows || []).map(function (f) {
      var key = p.id + '/' + f.id;
      var fn = { key: key, type: f.kind === 'page' ? 'page' : 'flow', title: f.id, label: f.id, sub: f.entry || '',
        badge: BADGE[f.trigger] || '', status: f.status || null, item: f };
      fn.unit = typeof f.actions === 'string' ? 'action' : 'step';
      fn.out = f.out || [];
      fn.into = f.into || [];
      all.push(fn);
      fn.steps = (f.steps || []).map(function (s, i) {
        var sn = { key: key + '#' + i, type: 'step', title: s.n + '. ' + s.text, label: s.title || s.text, num: s.n, sub: s.ref || '',
          status: s.status || null, item: s, parent: f, parentKey: key };
        all.push(sn);
        return sn;
      });
      return fn;
    });
    return { project: pn, flows: flows, groups: groups(flows), all: all };
  }

  // Flows by the group of their frontmatter, in order of first use. Flows without a group go last.
  function groups(flows) {
    var out = [], by = {}, other = [];
    flows.forEach(function (f) {
      var g = String(f.item.group || '').trim();
      if (!g) { other.push(f); return; }
      if (!by[g]) out.push(by[g] = { name: g, flows: [] });
      by[g].flows.push(f);
    });
    if (other.length) out.push({ name: out.length ? 'other' : '', flows: other });
    return out;
  }

  // The System tab as cards: each project, then each external system. The build puts the
  // incoming links of each external in `into`, and the lines in `system.edges`.
  function systemModel(data) {
    var projects = (data.projects || []).map(projectNode);
    var externals = (data.external || []).map(function (x) {
      var key = 'ext:' + x.id;
      return { key: key, type: 'external', title: x.id, label: x.id, sub: x.name || '', badge: String(x.kind || '').toUpperCase(),
        status: x.status || null, item: x, out: [], into: x.into || [] };
    });
    return { projects: projects, externals: externals, all: projects.concat(externals), edges: (data.system && data.system.edges) || [] };
  }

  // The index of the first project with a flow or step that matches the search, or -1.
  function firstTabWithMatch(data, q) {
    var ps = data.projects || [], i;
    for (i = 0; i < ps.length; i++) {
      if (model(ps[i]).all.some(function (n) { return n.type !== 'project' && matches(n, q); })) return i;
    }
    return -1;
  }

  // The tab of a URL hash: the index of the project it names, or -1 for the System tab.
  function tabFromHash(hash, projects) {
    var id;
    try { id = decodeURIComponent(String(hash || '').slice(1)); } catch (e) { return -1; }
    return (projects || []).map(function (p) { return p.id; }).indexOf(id);
  }

  function statusClass(n) { return STATUS[n.status] ? ' st-' + n.status : ''; }

    // A changed item keeps its old values in `old`: show the changed lines of this tab.
    if (it.old) {
      var before = tabText(Object.assign({}, it, it.old), tab), after = tabText(it, tab);
      if (before !== after) return diffHtml(before, after);
    }
    return it[tab] ? renderMd(it[tab]) : '<p class="empty">Nothing here yet.</p>';
  }

  function openDrawer(n) {
    var tabs = n.type === 'project' ? ['definition', 'flows'] : n.type === 'step' ? [] : n.type === 'external' ? ['links'] :
      ['definition', typeof n.item.actions === 'string' ? 'actions' : 'steps', 'boundary', 'links', 'rules'];
    if (tabs.length && tabs.indexOf(state.tab) < 0) state.tab = tabs[0];
    var h = ['<div class="dh"><div>', '<span class="chip" style="--c: var(--' + n.type + ')">' + esc(n.badge || n.type.toUpperCase()) + '</span>'];
    if (STATUS[n.status]) h.push('<span class="chip" style="--c: var(--' + n.status + ')">' + n.status + '</span>');
    h.push('<h2>' + esc(n.label) + '</h2>');
    if (n.sub && n.type !== 'step') h.push('<div class="meta">' + esc(n.sub) + '</div>');
    h.push('</div><button class="btn close" data-close aria-label="Close">\u00d7</button></div>');
    if (tabs.length) {
      h.push('<div class="tabs" role="tablist">' + tabs.map(function (k) {
        return '<button class="tab' + (k === state.tab ? ' on' : '') + '" role="tab" aria-selected="' + (k === state.tab) + '" data-tab="' + k + '">' +
          k.charAt(0).toUpperCase() + k.slice(1) + '</button>';
      }).join('') + '</div>');
    }
    h.push('<div class="db">' + body(n, tabs.length ? state.tab : 'step') + '</div>');
    var d = $('drawer');
    d.innerHTML = h.join('');
    d.classList.add('open');
    d.setAttribute('aria-hidden', 'false');
    state.open = n;
  }

  function closeDrawer() {
    var d = $('drawer');
    d.classList.remove('open');
    d.setAttribute('aria-hidden', 'true');
    var old = state.sel && state.world && nodeEl(state.sel);
    if (old) old.classList.remove('sel');
    state.sel = null;
    state.open = null;
  }

  function copy(value, btn) {
    function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = value;
      document.body.appendChild(ta);
      ta.select();
      try { if (document.execCommand('copy')) done(); } catch (e) { /* no clipboard */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(value).then(done, fallback);
    else fallback();
  }

  // ---- Wiring ----

  function activate(target) {
    var g = target.closest('[data-goto]');
    if (g) { goto(g.getAttribute('data-goto')); return true; }
    var tg = target.closest('[data-toggle]');
    if (tg) { toggleFlow(tg.getAttribute('data-toggle')); return true; }
    var node = target.closest('[data-key]');
    if (!node) return false;
    var key = node.getAttribute('data-key'), n = state.byKey[key];
    if (state.pi < 0 && n && n.type === 'project') switchProject(projectIndex(key), false);
    else select(key, false);
    return true;
  }

  function main() {
    applyTheme();
    if (media && media.addEventListener) media.addEventListener('change', applyTheme);
    state.data = JSON.parse($('mirror-data').textContent);
    state.world = $('world');
    state.ext = {};
    (state.data.external || []).forEach(function (x) { state.ext[x.id] = 1; });
    state.sys = systemModel(state.data);
    document.body.classList.toggle('review', (state.data.projects || []).some(hasChanges));
    document.title = state.data.title || 'Mirror';
    $('title').textContent = state.data.title || 'Mirror';
    $('meta').textContent = state.data.generated ? 'generated ' + state.data.generated : '';
    state.pi = projectFromHash();
    renderTabs();
    draw();
    initialView();
    bindCanvas($('canvas'));

    state.world.addEventListener('click', function (e) { if (!state.dragged) activate(e.target); });
    state.world.addEventListener('keydown', function (e) {
      // Buttons fire their own click on Enter and Space.
      if ((e.key !== 'Enter' && e.key !== ' ') || e.target.tagName === 'BUTTON') return;
      if (activate(e.target)) e.preventDefault();
    });
    $('drawer').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-close')) closeDrawer();
      else if (b.hasAttribute('data-tab')) { state.tab = b.getAttribute('data-tab'); openDrawer(state.open); }
      else if (b.hasAttribute('data-copy')) copy(b.getAttribute('data-copy'), b);
      else if (b.hasAttribute('data-goto')) goto(b.getAttribute('data-goto'));
    });
    $('ptabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-pi]');
      if (b) switchProject(Number(b.getAttribute('data-pi')), false);
    });
    $('ptabs').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') switchProject(state.pi + 1, true);
      else if (e.key === 'ArrowLeft') switchProject(state.pi - 1, true);
    });
    window.addEventListener('hashchange', function () {
      var i = projectFromHash();
      if (i !== state.pi) switchProject(i, false);
    });
    $('q').addEventListener('input', function (e) { search(e.target.value); });
    $('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); next(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.target.value = ''; search(''); e.target.blur(); }
    });
    $('collapse-all').addEventListener('click', function () { setAll(false); });
    $('expand-all').addEventListener('click', function () { setAll(true); });
    $('theme').addEventListener('click', toggleTheme);
    $('zoom-in').addEventListener('click', function () { zoomBy(1.25); });
    $('zoom-out').addEventListener('click', function () { zoomBy(0.8); });
    $('fit').addEventListener('click', fit);
    document.addEventListener('keydown', function (e) {
      var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
      if (e.key === 'Escape' && state.open) closeDrawer();
      else if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); }
    });
  }

  main();
})();
</script>
</body>
</html>
