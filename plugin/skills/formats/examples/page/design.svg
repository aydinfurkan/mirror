<text x="258" y="136" font-size="14" font-weight="600" fill="#09090b" text-anchor="start">Name</text><rect x="258" y="148" width="444" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8"/><text x="274" y="176" font-size="15" font-weight="400" fill="#09090b" text-anchor="start">Ada Lovelace</text>
